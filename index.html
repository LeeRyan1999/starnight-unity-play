<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>星夜小鎮 Unity 版</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1d2340;touch-action:none}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff3d8;font:600 20px system-ui,"Noto Sans TC",sans-serif;background:linear-gradient(#2c3a6e,#e9a86a)}
#bar{width:60vw;max-width:360px;height:10px;border-radius:6px;background:#0004;margin-top:14px;overflow:hidden}
#fill{height:100%;width:0;background:#ffd88a}
</style>
</head>
<body>
<canvas id="c" tabindex="-1"></canvas>
<div id="load">星夜小鎮 載入中…<div id="bar"><div id="fill"></div></div></div>
<script src="Build/WebGL.loader.js"></script>
<script>
createUnityInstance(document.getElementById('c'), {
  dataUrl:'Build/WebGL.data.unityweb', frameworkUrl:'Build/WebGL.framework.js.unityweb', codeUrl:'Build/WebGL.wasm.unityweb',
  companyName:'LeeRyan1999', productName:'星夜小鎮', productVersion:'1.0', devicePixelRatio: Math.min(window.devicePixelRatio||1, 2)
}, p => document.getElementById('fill').style.width=(p*100)+'%')
.then(u => { window.unityInstance=u; document.getElementById('load').remove(); })
.catch(e => { document.getElementById('load').textContent='載入失敗：'+e; });
</script>
</body>
</html>
