<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2c3a6e">
<title>星夜小鎮</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1d2340;touch-action:none}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff3d8;font-family:system-ui,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:radial-gradient(ellipse at 50% 110%,#f2b878 0%,#c9867a 25%,#4a4f8c 60%,#1d2340 100%);transition:opacity .4s}
#load h1{margin:0;font-size:clamp(34px,9vw,60px);letter-spacing:.12em;text-shadow:0 3px 12px #0006}
#load .sub{font-size:15px;opacity:.85;letter-spacing:.2em}
#bar{width:min(70vw,380px);height:12px;border-radius:8px;background:#0005;margin-top:18px;overflow:hidden;box-shadow:inset 0 1px 3px #0008}
#fill{height:100%;width:0;background:linear-gradient(90deg,#ffd88a,#ffb25e);transition:width .2s}
#msg{font-size:15px;opacity:.9;min-height:1.4em}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.7;animation:tw 2.4s infinite alternate}
@keyframes tw{to{opacity:.15}}
</style>
</head>
<body>
<canvas id="c" tabindex="-1"></canvas>
<div id="load">
  <h1>星夜小鎮</h1><div class="sub">STARNIGHT TOWN</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="msg">載入中… 0%</div>
</div>
<script>
// 星星點綴（純 CSS，不增加下載量）
for (let i=0;i<40;i++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*55+'%';s.style.animationDelay=Math.random()*2.4+'s';document.getElementById('load').appendChild(s);}
const msg=document.getElementById('msg'), fill=document.getElementById('fill');
const sc=document.createElement('script'); sc.src='Build/3ccc93289b23d372604004759ab5605e.loader.js';
sc.onload=()=>createUnityInstance(document.getElementById('c'),{
  dataUrl:'Build/54dcfd852e30103ffacb94bd6ccd865f.data.unityweb', frameworkUrl:'Build/de08b805094f1b3f435ac0293d2e6b95.framework.js.unityweb', codeUrl:'Build/a72990764730b8739c5e7f2865ce0c47.wasm.unityweb',
  companyName:"LeeRyan1999", productName:"星夜小鎮", productVersion:"1.0",
  devicePixelRatio:Math.min(window.devicePixelRatio||1,2),
  // 檔名帶雜湊，內容不會變 → 永久快取在 IndexedDB，第二次開啟不必重新下載
  cacheControl:url=>/\.(data|wasm|js)(\.unityweb|\.br|\.gz)?$/.test(url)?'immutable':'no-store'
},p=>{const v=Math.round(p*100);fill.style.width=v+'%';msg.textContent=v<90?('載入中… '+v+'%'):'準備小鎮中…';})
.then(u=>{window.unityInstance=u;const l=document.getElementById('load');l.style.opacity=0;setTimeout(()=>l.remove(),400);})
.catch(e=>{msg.textContent='載入失敗：'+e;});
document.body.appendChild(sc);
</script>
</body>
</html>
